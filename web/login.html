<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174b3f"><title>員工登入｜多一小步</title><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/employee.css"></head><body class="employee-login-body"><main class="employee-login-layout"><section class="login-story"><span class="login-mark" aria-hidden="true">↗</span><h1>多一小步<br>看見你的好</h1><p>把一句謝謝，留給值得被看見的人。<br>讓每一次主動，多一份溫度。</p><p class="login-promise">每一步，都值得被看見。</p></section><section class="login-panel"><h2>歡迎回來</h2><p>以員工工號與密碼登入，<br>接續團隊的每一份感謝。</p><div id="employeeLoginMessage" class="employee-message" role="status" hidden></div><form id="employeeLoginForm" class="employee-form"><label>工號<input name="id" id="employeeLoginId" autocomplete="username" required maxlength="30" placeholder="請輸入工號"></label><label>密碼<input name="password" id="employeeLoginPassword" type="password" autocomplete="current-password" required maxlength="128" placeholder="請輸入密碼"></label><button class="employee-button" id="employeeLoginSubmit">登入</button></form><p class="login-footer">首次登入請使用人資提供的工號與初始密碼。<br>尚未啟用帳號或忘記密碼，請聯繫人資。<br><a href="/admin.html">後台管理登入 ↗</a></p></section></main><script src="/employee-login.js"></script></body></html>
