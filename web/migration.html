<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新站首次匯入｜多一小步</title><link rel="stylesheet" href="admin.css"><main class="admin-main"><section class="upload-section"><h1>新站首次匯入備份</h1><p>請先<a href="/admin.html">登入新站後台</a>，再回到此頁。此功能僅限全新站台第一次使用。</p><p>選擇舊站「下載目前資料備份」取得的 JSON。會匯入便條紙、審核、加分、紙本統計及員工名冊；登入帳號需另至後台匯入員工 Excel。</p><form id="form"><input id="file" type="file" accept=".json" required><p><button class="primary-button">匯入舊站備份</button></p></form><p id="message" role="status"></p><p><a href="/admin.html">返回後台，匯入員工登入帳號</a></p></section></main><script type="module">
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const button=e.submitter,message=document.querySelector('#message'),file=document.querySelector('#file').files[0];if(!file)return;if(file.size>20*1024*1024){message.textContent='檔案上限 20 MB。';return}button.disabled=true;message.textContent='正在匯入，請勿關閉頁面…';try{const r=await fetch('/api/admin/migration',{method:'POST',headers:{'content-type':'application/json','x-small-step-write':'1'},body:await file.text()}),b=await r.json();if(!r.ok)throw Error(b.error);message.textContent=`匯入完成：${b.notes} 張匯入便條紙、${b.webSubmissions} 張網站便條紙、${b.roster} 位名冊、${b.reviewDecisions} 筆審核。請接著匯入員工登入帳號。`}catch(error){message.textContent=error.message}finally{button.disabled=false}};
</script></html>
