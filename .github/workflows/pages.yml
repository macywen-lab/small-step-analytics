name: Publish GitHub Pages entry

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build && npm test
      - run: npm run build:github-pages
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check public Pages URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "${PAGE_URL}?check=${GITHUB_RUN_ID}-${attempt}" > page.html &&
               grep -Fq '<meta http-equiv="refresh" content="0; url=https://' page.html; then
              echo "The public Pages URL serves the direct entry."
              exit 0
            fi
            sleep 5
          done
          exit 1
